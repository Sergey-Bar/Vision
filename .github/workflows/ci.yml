name: ci

# Manual only, and that is a deliberate state rather than a temporary one.
#
# This repository is private and on GitHub's free plan. GitHub Actions will not
# start a job for this account — every run fails in about three seconds with
# "recent account payments have failed or your spending limit needs to be
# increased" — which is an account-level billing state, not something this
# repository can fix. Before that, nine red checks on every pull request meant
# nothing: they did not indicate a broken build, they indicated that no job had
# ever started. A red X that carries no information is worse than no check.
#
# So this workflow is triggered by hand only, and `make verify` is the gate that
# actually runs. It is deliberately kept runnable rather than deleted: when
# billing is resolved, restoring the automatic triggers is a three-line change
# and the pipeline is already correct.
on:
  workflow_dispatch:

# No Milestone server is reachable from CI, and none is allowed to be. Every
# scenario the pipeline runs comes from sanitized versioned fixtures.
env:
  # Must be >= the `go` directive in go.mod. With GOTOOLCHAIN: local a pin below
  # the directive makes every job fail before it runs a test, so a green-looking
  # pipeline is not a passing pipeline. Bump this in the same commit that raises
  # the go directive.
  GO_VERSION: "1.26"
  GOTOOLCHAIN: local

# Least privilege. The default GITHUB_TOKEN is read/write on many repositories,
# and this pipeline needs to read the tree and nothing else. A compromised step
# in a third-party action inherits this, so this line is the difference between
# a supply-chain incident and a supply-chain write.
permissions:
  contents: read

# A second push to a branch cancels the run still in flight for it. Without this
# a rapid fix-push-push-fix sequence burns four runs' worth of the free tier's
# monthly minutes to learn what the last one already knows.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install protoc and protoc-gen-go
        run: |
          set -euo pipefail
          curl -fsSL -o protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          unzip -q protoc.zip -d "$HOME/protoc"
          echo "$HOME/protoc/bin" >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check contract compatibility
        run: make contract-check
      - name: Generated code is up to date
        run: |
          set -euo pipefail
          make generate
          if ! git diff --quiet -- internal/contracts; then
            echo "::error::internal/contracts is out of date. Run 'make generate' and commit the result."
            git diff --stat -- internal/contracts
            exit 1
          fi

  build:
    name: build and vet
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build -trimpath ./...
      - run: go vet ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: v2.14.0
          args: --timeout=5m
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: security
          POSTGRES_PASSWORD: security
          POSTGRES_DB: security_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SP_TEST_DATABASE_URL: postgres://security:security@localhost:5432/security_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # -p 1: the database-backed suites share one database and rebuild the
      # schema, so package test binaries must not run concurrently.
      - run: go test -p 1 -race -count=1 ./...

  rules:
    name: rule bundle lint
    runs-on: ubuntu-latest
    # Runs with no Milestone server reachable, which is the constraint that
    # makes it possible at all: the bundles are static input and the compiler
    # needs nothing else.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go run ./cmd/securityctl rules lint --bundle rules/builtin

  ai-runtime:
    name: AI runtime contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The plane has no third-party dependencies on purpose: a service that runs
      # on a customer's site and touches camera footage is not the place to take a
      # supply-chain dependency it does not need.
      - name: Check the runtime has no third-party imports
        run: |
          set -euo pipefail
          if grep -nE '^(import|from) ' deploy/ai-runtime/runtime.py \
             | grep -vE '(import|from) (__future__|base64|hashlib|json|os|time|dataclasses|http|pathlib|typing)'; then
            echo "::error::the AI runtime imports a third-party module"
            exit 1
          fi
          echo "standard library only"
      - run: py -m unittest discover -s deploy/ai-runtime -v

  secrets:
    name: no secrets in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Release archive contains no credential-shaped material
        run: |
          set -euo pipefail
          # A build-time guard. The stronger statement — the release builder
          # refuses to package a secret — is asserted by the builder's own tests.
          if git ls-files | grep -EIn '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16})'; then
            echo "::error::credential-shaped material committed to the repository"
            exit 1
          fi
          echo "no credential-shaped material in tracked files"

  migrations:
    name: migration phases
    runs-on: ubuntu-latest
    # Every migration filename must carry an expand/backfill/contract phase, and
    # no expand step may ship with a contract step in the same commit. Both are
    # safety rules about a running site, and neither was enforced by any job
    # before this one existed — `make ci` ran them, but CI never called `make ci`.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Every migration declares a phase
        run: make migration-phases
      - name: No contract step ships with the expand that makes it safe
        run: go test -count=1 -run 'TestM1ContainsNoContractStep' ./migrations/...
