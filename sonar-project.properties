# SonarQube static analysis.
#
# The descriptor, checked in so the configuration is reviewable in a diff. A scan
# whose settings live only in a command line is a scan whose settings nobody
# reviews.
#
# How the scan runs, and why there is no workflow for it: GitHub Actions cannot
# start a job on this account. GitHub's own message on a probe run is
# "The job was not started because recent account payments have failed or your
# spending limit needs to be increased" — every job failed in a few seconds having
# executed no steps. A workflow file here would be decoration that never runs, and
# decoration is what the previous review correctly removed.
#
# So the scan is run by hand, or by a self-hosted runner once billing is settled:
#
#   scripts/sonar.ps1
#
# When billing is fixed, add a workflow that runs that script and nothing else. The
# script is the scan; the workflow would only be a way to press it.
#
# What Sonar adds that the gate does not: duplication, complexity, coverage
# across the whole repository rather than per package, and a history of where debt
# accumulated. `scripts/gate.ps1` answers "does this build"; Sonar answers "is
# this getting worse".

sonar.projectKey=sergey-bar_ai-captain
sonar.projectName=Physical Security Intelligence Layer

sonar.sources=internal,cmd,tools,migrations
sonar.tests=internal,cmd
sonar.sourceEncoding=UTF-8

# Generated code is excluded rather than measured. Protobuf output is a different
# product's output, and measuring ours against it produces findings nobody can act
# on.
sonar.exclusions=**/internal/contracts/**,**/*.pb.go,**/testdata/**,**/dist/**,**/bin/**,**/__pycache__/**

# The Python AI runtime is standard library only. The workflow-era check for that
# is scripts/gate.ps1; Sonar reads the same files for correctness and complexity.
sonar.python.version=3.11

# The repository's own static checks, restated as Sonar rules, so a finding here
# and a failure in the gate agree with each other rather than contradicting.
sonar.go.vet=true
sonar.go.gofmt=true

# Coverage has to be measured across the repository, not per package: a test in
# one package that exercises another still covers it, and measuring per package
# reports several packages as untested that are not.
#
# The coverage report path is set by the scan script.
