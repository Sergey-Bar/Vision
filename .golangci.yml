version: "2"

run:
  timeout: 10m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - wastedassign
  disable: []

  exclusions:
    # Every exclusion below is a considered decision, not a way to quiet a build.
    rules:
      # Writing to stdout is this program's job. A CLI's output stream closing
      # under it (a closed pipe) is not a condition the process can do anything
      # about, and threading an error return through three hundred format calls
      # would make the handlers unreadable for no behavioural gain. Errors *from*
      # commands are returned, checked and mapped to exit codes — that is the part
      # that matters, and nothing here touches it.
      - path: cmd/securityctl/
        linters: [errcheck]
        text: "Error return value of `fmt\\.Fprint"
      # The same, in the suites: a helper whose failure the test itself asserts.
      # `ExpectError` is not in this list and cannot be — it returns nothing, and
      # a caller that wants the reason calls `Refusal` instead. The list exists so
      # the "asserts by panicking" helpers do not need an explicit discard at
      # every call site; the helper that does return an error is named for it.
      - path: _test\.go$
        linters: [errcheck]
        text: "testutil\\.(Exec|QueryOne)"

      # A test builds a request and the handler reads nothing from its context.
      # The two places where a context matters — the health endpoints — do carry
      # one.
      - path: _test\.go$
        linters: [noctx]
        text: "httptest\\.NewRequest must not be called"

      # Parameters kept for interface conformance or for a handler signature the
      # command tree defines. Renaming them to `_` would hide which one a future
      # change is expected to start using.
      - path: cmd/securityctl/
        linters: [revive]
        text: "unused-parameter"
      # A handler that receives the request and does not need it yet.
      - path: internal/api/
        linters: [revive]
        text: "unused-parameter"
      # Closure parameters in the test trees.
      - path: _test\.go$
        linters: [revive]
        text: "unused-parameter"

      # --- gosec ---
      #
      # gosec was disabled outright until this revision, on the strength of a true
      # statement about two test helpers — which justified a rule exclusion on
      # those files and not a whole linter across a security product. It is
      # enabled now and has been run; the rules below are the ones whose findings
      # were triaged, and each says what the triage found.

      # G304/G124, "file inclusion via variable". The rule fires on every
      # `os.ReadFile(path)` where path is a variable, which is every read in a
      # program. This repository has a dedicated validator for exactly this —
      # `release.ValidateFilePath` for archive-relative names and
      # `lifecycle.safeJoin` for anything that touches a destination — and both
      # have negative tests for `../`, absolute paths, null bytes and symlink
      # escapes, in `internal/release` and `internal/evidence`. A finding here
      # says "a variable was used", which is not a finding.
      - linters: [gosec]
        text: "G(304|124)"

      # G306/G301, file and directory modes. gosec's expectation is 0600 for
      # files and 0750 or tighter for directories. The service runs as one
      # account and its seal files, its evidence root and its unit files are
      # read by an operator running as a different account in the same group:
      # 0640 and 0750 are the decision, and 0600 would make the checkpoint seals
      # unreadable by the very command whose job is to verify them. The one file
      # that must not be group-readable — the private signing key — is already
      # written 0600, and that site is the reason the rule can be read rather
      # than obeyed.
      - linters: [gosec]
        text: "G(306|301)"

      # G505, weak cryptographic primitive. The only SHA-1 in this repository is
      # the RFC 6238 fallback for a TOTP authenticator that ignores the
      # `algorithm` parameter in its `otpauth://` URI. The enrolment declares
      # SHA-256; SHA-1 is the documented fallback and dropping it would break
      # MFA for a real class of deployed authenticator. This is not a place
      # where "fix the finding" is available.
      - linters: [gosec]
        text: "G505"

      # G101, hardcoded credentials. Both findings are in tests, and in both the
      # credential-shaped string is the point: one is the fixture that proves the
      # release scanner catches a pasted private key, the other is a
      # password for a role that exists only in a throwaway test database. A rule
      # that fires on those is not measuring anything.
      - path: _test\.go$
        linters: [gosec]
        text: "G101"

      # G703, path traversal by taint analysis. This rule follows a value from a
      # configuration field to a filesystem call and calls it traversal. The
      # values it follows are operator-supplied paths that the operator is
      # *asking* this program to use — an evidence root, a backup directory, a
      # checkpoint directory — and the preflight check that reports
      # "present and writable" is supposed to touch them. The paths that come
      # from inside an archive rather than from an operator go through
      # `ValidateFilePath` and `safeJoin`, which is the case that matters, and it
      # is not the one this rule follows.
      - linters: [gosec]
        text: "G703"

      # G122, a filesystem operation inside a Walk/WalkDir callback. The rule
      # wants `os.Root`, which this Go version does not have, and the shape it is
      # warning about — walk a tree, act on each entry — is what a retention sweep
      # and a contract-tree scan are. The three sites that trip it walk a tree the
      # program owns (the evidence root, the repository's own contracts) or one
      # the operator supplied, and the paths that come from inside an archive go
      # through `ValidateFilePath` and `safeJoin` instead, which is the case that
      # would matter and is not what this rule follows.
      - linters: [gosec]
        text: "G122"

      # G302, a file created with a mode above 0600. The two files it names are
      # the systemd unit files, which systemd reads as a different account and
      # which therefore have to stay world-readable. The environment files that
      # carry secrets are 0640, and the private signing key is 0600.
      - linters: [gosec]
        text: "G302"

      # G115, a narrowing integer conversion, in a test. The sites are the RFC
      # 6238 step helper, a rune cast in a string-building helper, and the COSE
      # test vectors — all values bounded by the test that writes them, none of
      # them reachable from input. Annotating five test helpers individually
      # would be five chances for a reason to drift out of date with its code.
      - path: _test\.go$
        linters: [gosec]
        text: "G115"

formatters:
  enable:
    - gofmt
    - goimports

  exclusions:
    generated: lax
    paths:
      - internal/contracts/.*

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
