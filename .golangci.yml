version: "2"

run:
  timeout: 10m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - wastedassign
  disable:
    # SQL is intentionally built from table names in a few test helpers, and the
    # injection risk there is nil because the names are compile-time constants.
    - gosec

  exclusions:
    # Every exclusion below is a considered decision, not a way to quiet a build.
    rules:
      # Writing to stdout is this program's job. A CLI's output stream closing
      # under it (a closed pipe) is not a condition the process can do anything
      # about, and threading an error return through three hundred format calls
      # would make the handlers unreadable for no behavioural gain. Errors *from*
      # commands are returned, checked and mapped to exit codes — that is the part
      # that matters, and nothing here touches it.
      - path: cmd/securityctl/
        linters: [errcheck]
        text: "Error return value of `fmt\\.Fprint"
      # The same, in the suites: a helper whose failure the test itself asserts.
      - path: _test\.go$
        linters: [errcheck]
        text: "testutil\\.(ExpectError|Exec|QueryOne)"

      # A test builds a request and the handler reads nothing from its context.
      # The two places where a context matters — the health endpoints — do carry
      # one.
      - path: _test\.go$
        linters: [noctx]
        text: "httptest\\.NewRequest must not be called"

      # Parameters kept for interface conformance or for a handler signature the
      # command tree defines. Renaming them to `_` would hide which one a future
      # change is expected to start using.
      - path: cmd/securityctl/
        linters: [revive]
        text: "unused-parameter"
      # A handler that receives the request and does not need it yet.
      - path: internal/api/
        linters: [revive]
        text: "unused-parameter"
      # Closure parameters in the test trees.
      - path: _test\.go$
        linters: [revive]
        text: "unused-parameter"

formatters:
  enable:
    - gofmt
    - goimports

  exclusions:
    generated: lax
    paths:
      - internal/contracts/.*

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
