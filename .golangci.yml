version: "2"

run:
  timeout: 10m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - wastedassign
  disable:
    # gosec is disabled, and the reason is a gap rather than a position.
    #
    # The previous reason here was "SQL is intentionally built from table names
    # in a few test helpers" — which is true, and which justifies a rule
    # exclusion on two test files, not the whole linter across a security
    # product. A linter disabled by a two-line justification is a linter nobody
    # decided to run, and this repository's own working rule is that a control
    # which has never been seen red is not a control. The honest statement is
    # the one below.
    #
    # golangci-lint is not installed on the machine this was written on, so
    # enabling gosec here would add a linter nobody has run and whose findings
    # are unknown — decoration that reads as coverage. The work is: install
    # MinGW-w64 and golangci-lint, enable gosec, triage what it reports, and
    # either fix the findings or replace this note with a narrowly-scoped
    # exclusion naming the rule and the file. Until then this is a known gap,
    # recorded in docs/status.md, not a decision.
    - gosec

  exclusions:
    # Every exclusion below is a considered decision, not a way to quiet a build.
    rules:
      # Writing to stdout is this program's job. A CLI's output stream closing
      # under it (a closed pipe) is not a condition the process can do anything
      # about, and threading an error return through three hundred format calls
      # would make the handlers unreadable for no behavioural gain. Errors *from*
      # commands are returned, checked and mapped to exit codes — that is the part
      # that matters, and nothing here touches it.
      - path: cmd/securityctl/
        linters: [errcheck]
        text: "Error return value of `fmt\\.Fprint"
      # The same, in the suites: a helper whose failure the test itself asserts.
      - path: _test\.go$
        linters: [errcheck]
        text: "testutil\\.(ExpectError|Exec|QueryOne)"

      # A test builds a request and the handler reads nothing from its context.
      # The two places where a context matters — the health endpoints — do carry
      # one.
      - path: _test\.go$
        linters: [noctx]
        text: "httptest\\.NewRequest must not be called"

      # Parameters kept for interface conformance or for a handler signature the
      # command tree defines. Renaming them to `_` would hide which one a future
      # change is expected to start using.
      - path: cmd/securityctl/
        linters: [revive]
        text: "unused-parameter"
      # A handler that receives the request and does not need it yet.
      - path: internal/api/
        linters: [revive]
        text: "unused-parameter"
      # Closure parameters in the test trees.
      - path: _test\.go$
        linters: [revive]
        text: "unused-parameter"

formatters:
  enable:
    - gofmt
    - goimports

  exclusions:
    generated: lax
    paths:
      - internal/contracts/.*

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
